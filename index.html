<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Capital Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
    #secret { position:absolute; width:7px; height:7px; border-radius:50%; background:#fff; cursor:pointer; transition:box-shadow 0.3s; }
    #secret:hover { box-shadow:0 0 8px rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <canvas id="galaxy"></canvas>
  <div id="secret" title="🌟 Secret Star"></div>

  <script>
    const c = document.getElementById('galaxy');
    const ctx = c.getContext('2d');
    const secret = document.getElementById('secret');
    let w, h;

    function resize() {
      w = c.width = window.innerWidth;
      h = c.height = window.innerHeight;
      init();
    }

    // Galaxy elements
    const stars = [], nebula = [], asteroids = [];
    let planets = [];

    function rand(a, b) { return Math.random()*(b-a)+a; }

    function init() {
      stars.length = nebula.length = asteroids.length = planets.length = 0;
      for(let i=0;i<300;i++)
        stars.push({x:rand(0,w), y:rand(0,h), r:rand(0.5,1.5), vx:rand(-0.03,0.03), vy:rand(0.02,0.06), a:rand(0.1,0.8)});
      for(let i=0;i<5;i++)
        nebula.push({x:rand(0,w), y:rand(0,h), r:rand(w*0.2, w*0.6), hue:rand(180,260)});
      for(let i=0;i<40;i++)
        asteroids.push({x:rand(0,w), y:rand(0,h), r:rand(1,3), vx:rand(-0.1,0.1), vy:rand(-0.1,0.1)});
      // One planet with moon and satellite
      planets.push({
        x: w*0.3, y: h*0.5, r:20,
        moon: {r:6, dist:50, angle:0},
        sat: {r:4, dist:80, angle:rand(0,Math.PI*2)}
      });
      placeSecret();
    }

    function placeSecret() {
      secret.style.left = rand(20, w-25)+'px';
      secret.style.top = rand(20, h-25)+'px';
    }

    secret.addEventListener('click',()=>{
      // alert('🎉 You found the hidden star!');
      window.location.href="network.html";
      placeSecret();
    });

    let tick = 0;
    function anim() {
      ctx.clearRect(0,0,w,h);
      // Nebula
      nebula.forEach(n=>{
        const g = ctx.createRadialGradient(n.x,n.y,n.r*0.1,n.x,n.y,n.r);
        g.addColorStop(0, `hsla(${n.hue},60%,60%,0.15)`);
        g.addColorStop(1, `hsla(${n.hue},60%,20%,0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,2*Math.PI); ctx.fill();
      });
      // Stars
      stars.forEach(s=>{
        s.x += s.vx; s.y += s.vy;
        if(s.x<0||s.x>w) s.x=rand(0,w);
        if(s.y<0||s.y>h) s.y=rand(0,h);
        ctx.globalAlpha = s.a;
        ctx.fillStyle = "#fff";
        ctx.fillRect(s.x,s.y,s.r,s.r);
      });
      ctx.globalAlpha = 1;
      // Asteroids
      asteroids.forEach(a=>{
        a.x += a.vx; a.y += a.vy;
        if(a.x<0||a.x>w) a.vx *= -1;
        if(a.y<0||a.y>h) a.vy *= -1;
        ctx.fillStyle = "#aaa";
        ctx.beginPath();
        ctx.arc(a.x,a.y,a.r,0,2*Math.PI);
        ctx.fill();
      });
      // Planets
      planets.forEach(p=>{
        // planet
        ctx.fillStyle = 'orange';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,2*Math.PI); ctx.fill();
        // moon
        p.moon.angle += 0.02;
        const mx = p.x + Math.cos(p.moon.angle)*p.moon.dist;
        const my = p.y + Math.sin(p.moon.angle)*p.moon.dist;
        ctx.fillStyle = 'lightgray';
        ctx.beginPath(); ctx.arc(mx,my,p.moon.r,0,2*Math.PI); ctx.fill();
        // satellite
        p.sat.angle += 0.015;
        const sx = p.x + Math.cos(p.sat.angle)*p.sat.dist;
        const sy = p.y + Math.sin(p.sat.angle)*p.sat.dist;
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(sx,sy,p.sat.r,0,2*Math.PI); ctx.fill();
      });
      tick++;
      requestAnimationFrame(anim);
    }

    window.addEventListener('resize', resize);
    resize();
    anim();
  </script>
</body>
</html>
